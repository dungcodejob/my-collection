<div class="flex flex-col justify-between">
  <div class="flex flex-col py-2">
    <div class="mt-4 mb-2 px-5 flex justify-between items-center">
      <h2 class="text-lg font-semibold tracking-tight">Collection</h2>
      <button hlmBtn class="w-9 h-9" size="icon" variant="ghost" (click)="onCreate()">
        <hlm-icon name="lucidePlus" size="base"></hlm-icon>
      </button>
    </div>
    <nav class="grid gap-1 px-2 items-center">
      @for (item of $entities(); track $index) {
        <div hlmBtn class="group w-full" variant="ghost" size="sm" class="relative">
          <a href="#" class="w-full h-full flex items-center justify-between">
            <div class="flex gap-2 items-center">
              <hlm-icon name="lucideFolder" size="sm"></hlm-icon>

              <div class="flex">{{ item.title }}</div>
            </div>
          </a>

          <button
            hlmBtn
            [brnMenuTriggerFor]="menu"
            class="absolute group-hover:opacity-100 opacity-0 right-0 -translate-x-1/4 top-1/2 -translate-y-1/2 w-6 h-6 z-10 hover:bg-gray-200"
            size="icon"
            variant="ghost">
            <hlm-icon name="lucideEllipsis" size="sm"></hlm-icon>
          </button>

          <ng-template #menu>
            <hlm-sub-menu>
              <button hlmMenuItem>
                <hlm-icon name="lucideMail" hlmMenuIcon />
                Edit
              </button>

              <button hlmMenuItem>
                <hlm-icon name="lucideMessageSquare" hlmMenuIcon />
                Remove
              </button>
              <hlm-menu-separator />
              <button hlmMenuItem>
                <hlm-icon name="lucidePlusCircle" hlmMenuIcon />
                <span>More</span>
              </button>
            </hlm-sub-menu>
          </ng-template>
        </div>
      }
    </nav>
  </div>
</div>
