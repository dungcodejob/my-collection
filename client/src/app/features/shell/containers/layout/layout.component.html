<div class="flex flex-col min-h-screen bg-gray-50">
  @if (vm$ | async; as vm) {
    @if (vm.hasHeader) {
      <app-header
        class="sticky top-0 inset-x-0 z-[48] w-full bg-white border-b text-sm lg:ps-64 border-border ">
      </app-header>
    }
    @if (vm.hasSideBar) {
      <app-sidebar>
        <router-outlet name="sidebar"></router-outlet>
      </app-sidebar>

      <div class="w-full pt-10 px-4 sm:px-6 md:px-8 lg:ps-72">
        <router-outlet></router-outlet>
      </div>
    }
  }
</div>
