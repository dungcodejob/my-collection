<div class="flex flex-col min-h-screen bg-gray-50">
  @if (vm$ | async; as vm) {
    @if (vm.hasHeader) {
      <app-header
        class="sticky top-0 inset-x-0 z-[48] w-full bg-white border-b text-sm lg:ps-64 border-border">
      </app-header>
    }
    @if (vm.hasSideBar) {
      <app-sidebar>
        <app-collection-list></app-collection-list>
      </app-sidebar>

      <div class="w-full pt-10 px-4 sm:px-6 md:px-8 lg:ps-72">
        <router-outlet></router-outlet>
      </div>
    }
  }
</div>

<hlm-toaster />
@if ($loading()) {
  <div
    class="w-screen h-screen fixed z-[99] top-0 left-0 bg-white bg-opacity-60 flex justify-center items-center">
    <hlm-spinner />
  </div>
}
