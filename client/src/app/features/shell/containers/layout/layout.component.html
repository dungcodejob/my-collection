<div class="flex flex-col min-h-screen bg-gray-50">
  @if (vm$ | async; as vm) {
    @if (vm.hasSideBar) {
      <app-sidebar>
        <app-collection-list></app-collection-list>
      </app-sidebar>

      <div class="w-full">
        <router-outlet></router-outlet>
      </div>
    }
  }
</div>

<hlm-toaster />
@if ($loading()) {
  <div
    class="w-screen h-screen fixed z-[9999] top-0 left-0 bg-white bg-opacity-60 flex justify-center items-center">
    <hlm-spinner />
  </div>
}
