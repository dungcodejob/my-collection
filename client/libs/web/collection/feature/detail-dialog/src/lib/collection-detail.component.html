<form [formGroup]="form" (ngSubmit)="onSave()" class="flex flex-col gap-4">
  <hlm-dialog-header>
    <h3 hlmDialogTitle>{{ data ? "Update" : "Create" }} Collection</h3>
    <p hlmDialogDescription>
      Make create or update to your collection here. Click save when you're done.
    </p>
  </hlm-dialog-header>
  <div class="grid gap-4 py-4">
    <div class="space-y-1">
      <label hlmLabel for="title">Title</label>
      <input
        hlmInput
        class="w-full focus-visible:ring-1 focus-visible:ring-offset-0"
        size="sm"
        formControlName="title"
        id="title"
        type="text"
        placeholder="Example: Work"
        autocapitalize="none"
        autocomplete="off"
        autocorrect="off"
      />
      <div *ngIf="title.invalid && (title.dirty || title.touched)">
        <div *ngIf="title.errors?.['required']" hlmInputError>Title is required.</div>
      </div>
    </div>
  </div>
  <hlm-dialog-footer>
    <button hlmBtn type="button" variant="outline" (click)="onClose()">Close</button>
    <button hlmBtn [disabled]="isSaveButtonDisabled" type="submit" (click)="onSave()">
      @if ($isPending()) {

        <ng-icon hlm size="sm" class="mr-2 animate-spin" name="lucideLoaderCircle" />
      }
      <span>Save changes</span>
    </button>
  </hlm-dialog-footer>
</form>
