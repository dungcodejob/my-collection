<div class="space-y-1">
  <h3
    class="px-2 py-1 flex items-center justify-between text-xs font-medium text-gray-500 dark:text-gray-400"
  >
    Collection

    <button
      class="w-6 h-6"
      hlmBtn
      size="icon"
      type="button"
      variant="ghost"
      (click)="onOpenCreateDialog()"
    >
      <ng-icon hlm name="lucidePlus" size="16" />
    </button>
  </h3>

  <mc-collection-tree
    [isDisplayRoot]="false"
    [node]="facade.$root()"
    [tree]="facade.$collections()"
    (nodeExpand)="onNodeExpand($event)"
  />
</div>
<mc-collection-detail-dialog
  [isOpen]="facade.$isOpen()"
  [parent]="facade.$root()"
  (closed)="onCloseDialog()"
  (create)="onCreateCollection($event)"
  (update)="onUpdateCollection($event)"
/>
