<div class="space-y-1">
  <!-- Main menu item -->

  @let node = $node();

  <div class="block relative">
    <button
      class="flex w-full items-center rounded-lg pl-8 pr-3 py-2 text-left text-sm font-medium text-gray-700 transition-colors hover:bg-gray-100 hover:text-gray-900 dark:text-gray-300 dark:hover:bg-gray-800 dark:hover:text-gray-100"
      type="button"
      [class.justify-center]="$isSidebarCollapsed()"
      (click)="onSelect()"
    >
      <div class="flex items-center gap-3">
        <ng-icon class="shrink-0" size="16" [name]="node.icon || 'lucideFolder'" />
        @if (!$isSidebarCollapsed()) {
        <span class="flex-1">{{ node.name }}</span>

        <!-- @if (item.shortcut) {
    <kbd
      class="pointer-events-none inline-flex h-5 select-none items-center gap-1 rounded border bg-gray-100 px-1.5 font-mono text-xs font-medium text-gray-600 dark:bg-gray-800 dark:text-gray-400"
    >
      {{ item.shortcut }}
    </kbd>
    }  -->

        }
      </div>
    </button>

    @if ($isHasChild()) {

    <button
      class="size-6 absolute left-1 top-1/2 -translate-y-1/2"
      hlmBtn
      size="icon"
      type="button"
      variant="ghost"
      (click)="onToggleCollapse()"
    >
      <ng-icon
        class="shrink-0 text-gray-400"
        hlm
        name="lucideChevronRight"
        size="sm"
        [@chevronRotate]="$collapseState()"
      />
    </button>

    }

    <button
      class="size-8 absolute right-1 top-1/2 -translate-y-1/2"
      hlmBtn
      size="icon"
      type="button"
      variant="ghost"
      [brnMenuTriggerFor]="menu"
    >
      <ng-icon hlm name="lucideEllipsisVertical" size="sm" />
    </button>
  </div>

  <!-- Submenu items -->

  @if ($isHasChild()) {
  <div
    class="ml-4 pl-3 border-gray-200 dark:border-gray-700"
    [@expandCollapse]="$collapseState()"
  >
    @for (item of $items(); track item.id) {
    <mc-collection-node [node]="item" />
    }
  </div>
  }

  <ng-template #menu>
    <hlm-menu class="w-40">
      <hlm-menu-group>
        <button hlmMenuItem type="button" (click)="onUpdate()">
          <span>Update</span>
        </button>

        <button hlmMenuItem type="button" (click)="onDelete()">
          <span>Delete</span>
        </button>
      </hlm-menu-group>
    </hlm-menu>
  </ng-template>
</div>
