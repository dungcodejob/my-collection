<div
  aria-label="Main navigation"
  class="sidebar-container h-full bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-700 transition-all duration-300 ease-in-out"
  role="navigation"
  [attr.aria-expanded]="!isCollapsed()"
  [class]="{ collapsed: isCollapsed() }"
>
  <!-- Header with toggle button -->
  <div
    class="sidebar-header p-4 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between"
  >
    @if (!isCollapsed()) {
    <div class="logo-section flex items-center">
      <ng-icon class="text-blue-600 mr-2" name="lucideBookmark" size="24" />
      <span class="text-lg font-semibold text-gray-800 dark:text-white"
        >MyCollection</span
      >
    </div>
    }

    <p-button
      severity="secondary"
      size="small"
      tooltipPosition="right"
      [attr.aria-label]="isCollapsed() ? 'Mở rộng sidebar' : 'Thu nhỏ sidebar'"
      [pTooltip]="isCollapsed() ? 'Mở rộng sidebar' : 'Thu nhỏ sidebar'"
      [rounded]="true"
      [text]="true"
      (onClick)="toggleSidebar()"
    >
      <ng-icon
        size="16"
        [name]="isCollapsed() ? 'lucideChevronRight' : 'lucideChevronLeft'"
      />
    </p-button>
  </div>

  <!-- Navigation Menu -->
  <nav aria-label="Sidebar navigation" class="sidebar-nav p-2">
    <ul class="space-y-1" role="list">
      @for (item of menuItems; track item.url) {
      <li class="nav-item relative" role="listitem">
        <mc-nav-item [isActive]="false" [isCollapsed]="isCollapsed()" [item]="item" />

        @if (item.badge && !isCollapsed()) {
        <!-- Badge for notifications when expanded -->
        <span
          class="absolute top-2 right-2 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white bg-red-500 rounded-full"
        >
          {{ item.badge }}
        </span>
        } @if (item.badge && isCollapsed()) {
        <!-- Badge dot when collapsed -->
        <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full"></span>
        }
      </li>
      }
    </ul>
  </nav>

  @if (!isCollapsed()) {
  <!-- Footer section -->
  <div class="sidebar-footer mt-auto p-4 border-t border-gray-200 dark:border-gray-700">
    <div class="text-xs text-gray-500 dark:text-gray-400 text-center">
      <p>MyCollection v1.0</p>
    </div>
  </div>
  }
</div>
